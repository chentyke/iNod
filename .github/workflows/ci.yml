name: CI

on:
  pull_request:
  # PR checks exercise the trial merge. Run the workflow by hand to test a branch again.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  design-checks:
    name: Design checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.scope.outputs.docs-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check if the PR only changes documentation
        id: scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git diff --no-renames --name-only -z HEAD^1 HEAD | node -e '
            const files = require("node:fs").readFileSync(0, "utf8").split("\0").filter(Boolean);
            const docsOnly = files.length > 0 && files.every(path =>
              path === "README.md" || path === "CONTRIBUTING.md" || /^docs\/[\s\S]+\.md$/.test(path)
            );
            console.log(`docs-only=${docsOnly}`);
          ' >> "$GITHUB_OUTPUT"
      - name: Check SwiftUI code against docs/DESIGN.md
        run: node scripts/check-design.mjs

  swift-and-website:
    needs: design-checks
    if: ${{ !cancelled() && (needs.design-checks.result != 'success' || needs.design-checks.outputs.docs-only != 'true') }}
    name: Swift and website checks
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Swift unit tests
        run: xcrun swift test
      - name: Check website scripts and WebKit parsing
        run: sh scripts/verify-website.sh

  ios-ui-tests:
    needs: design-checks
    if: ${{ !cancelled() }}
    # The iPhone run keeps its original check name, which branch protection requires.
    name: ${{ matrix.check }}
    # Keep both matrix check names on docs-only PRs without allocating a Mac runner.
    runs-on: ${{ needs.design-checks.result == 'success' && needs.design-checks.outputs.docs-only == 'true' && 'ubuntu-latest' || 'xcode-27' }}
    timeout-minutes: ${{ matrix.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: iOS UI tests
            device: iPhone 17
            results: NodeSeekUITests
            # Allow for a slow build as well as the full UI suite on hosted runners.
            timeout-minutes: 60
            parallel-options: -parallel-testing-enabled YES -parallel-testing-worker-count 2
            tests: ''
            retries: ''
          - check: iPad UI tests
            device: iPad Pro 13-inch (M5)
            results: NodeSeekUITests-iPad
            timeout-minutes: 40
            parallel-options: -parallel-testing-enabled NO
            tests: >-
              -only-testing:NodeSeekUITests/AdaptiveLayoutTests
              -only-testing:NodeSeekUITests/ThreadHistoryTests
              -only-testing:NodeSeekUITests/AttendanceViewTests/testUncheckedAttendanceShowsActionsAndKeepsReadableColumn
              -only-testing:NodeSeekUITests/ProgressViewTests/testUpgradingProgressShowsLevelQuotasAndKeepsReadableColumn
              -only-testing:NodeSeekUITests/StardustHistoryViewTests/testStardustHistoryDisplaysBalanceRecordsAndNavigates
            # The hosted iPad simulator is slow and now and then fails to stop the app between tests.
            # A test that fails both times still fails the check.
            retries: -retry-tests-on-failure -test-iterations 2
    steps:
      - name: Report documentation-only check
        if: needs.design-checks.result == 'success' && needs.design-checks.outputs.docs-only == 'true'
        run: echo "Documentation only. No simulator needed."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        if: needs.design-checks.result != 'success' || needs.design-checks.outputs.docs-only != 'true'
        with:
          persist-credentials: false
      - name: Start the ${{ matrix.device }} simulator
        id: simulator
        if: steps.checkout.outcome == 'success'
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          simulator_id="$(xcrun simctl list devices available --json | node -e '
            const { devices } = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            const name = process.env.DEVICE;
            const simulator = devices["com.apple.CoreSimulator.SimRuntime.iOS-27-2"]?.find((device) => device.name === name);
            if (!simulator) throw new Error(`${name} with iOS 27.2 is unavailable`);
            console.log(simulator.udid);
          ')"
          xcrun simctl bootstatus "$simulator_id" -b
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"
      - name: Build and test on ${{ matrix.device }}
        if: steps.simulator.outcome == 'success'
        shell: bash
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
          PARALLEL_OPTIONS: ${{ matrix.parallel-options }}
          TESTS: ${{ matrix.tests }}
          RETRIES: ${{ matrix.retries }}
        run: |
          read -ra args <<< "$PARALLEL_OPTIONS $TESTS $RETRIES"
          xcodebuild -project NodeSeek.xcodeproj -scheme NodeSeek \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            "${args[@]}" \
            -resultBundlePath "$RUNNER_TEMP/${{ matrix.results }}.xcresult" \
            CODE_SIGN_IDENTITY=- test
      - name: Upload failed test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.results }}
          path: ${{ runner.temp }}/${{ matrix.results }}.xcresult
          retention-days: 7

  mac-ui-tests:
    needs: design-checks
    if: ${{ !cancelled() && (needs.design-checks.result != 'success' || needs.design-checks.outputs.docs-only != 'true') }}
    name: Mac UI tests
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test the Mac Catalyst app
        # On the hosted Mac runner, clicks and key presses that UI tests send never reach the Catalyst app's
        # content, so the Mac runs only the checks that need no input. iPhone and iPad cover the rest.
        run: |
          xcodebuild -project NodeSeek.xcodeproj -scheme NodeSeek \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            -parallel-testing-enabled NO \
            -only-testing:NodeSeekUITests/AdaptiveLayoutTests/testAllTabsAreOnScreen \
            -only-testing:NodeSeekUITests/AdaptiveLayoutTests/testFeedKeepsAReadableCentredColumn \
            -only-testing:NodeSeekUITests/AdaptiveLayoutTests/testThreadCardsAndReplyBarShareOneColumn \
            -only-testing:NodeSeekUITests/AdaptiveLayoutTests/testConversationBubblesAndComposerShareOneColumn \
            -only-testing:NodeSeekUITests/AdaptiveLayoutTests/testSidebarSelectionIsReadableInDarkMode \
            -only-testing:NodeSeekUITests/AdaptiveLayoutTests/testMenuBarIncludesManualRefreshCommand \
            -resultBundlePath "$RUNNER_TEMP/NodeSeekUITests-Mac.xcresult" \
            CODE_SIGN_IDENTITY=- test
      - name: Upload failed test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NodeSeekUITests-Mac
          path: ${{ runner.temp }}/NodeSeekUITests-Mac.xcresult
          retention-days: 7

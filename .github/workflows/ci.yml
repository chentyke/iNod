name: CI

on:
  pull_request:
    branches: [main, 'image-stack/**']
  # No push trigger: main requires PRs to be up to date before merging, so a PR's checks already
  # cover the merged result. Run the workflow by hand when main needs checking again.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  design-checks:
    name: Design checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check SwiftUI code against docs/DESIGN.md
        run: node scripts/check-design.mjs

  swift-and-website:
    name: Swift and website checks
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Swift unit tests
        run: xcrun swift test
      - name: Check website scripts and WebKit parsing
        run: sh scripts/verify-website.sh

  ios-ui-tests:
    name: iOS UI tests
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # TEMP: sample the busiest processes to find what keeps the runner's CPUs busy. Remove before merging.
      - name: Sample CPU usage in the background
        run: |
          nohup sh -c 'while :; do date -u +%T; ps -Aro pcpu,comm | head -8 | cut -c1-110; sleep 30; done' \
            > "$RUNNER_TEMP/cpu.log" 2>&1 &
      - name: Start the iPhone 17 simulator
        id: simulator
        run: |
          simulator_id="$(xcrun simctl list devices available --json | node -e '
            const { devices } = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            const simulator = devices["com.apple.CoreSimulator.SimRuntime.iOS-27-2"]?.find(({ name }) => name === "iPhone 17");
            if (!simulator) throw new Error("iPhone 17 with iOS 27.2 is unavailable");
            console.log(simulator.udid);
          ')"
          xcrun simctl bootstatus "$simulator_id" -b
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"
      - name: Build and test on iPhone 17
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          xcodebuild -project NodeSeek.xcodeproj -scheme NodeSeek \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/NodeSeekUITests.xcresult" \
            CODE_SIGN_IDENTITY=- test
      - name: Upload failed test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NodeSeekUITests
          path: ${{ runner.temp }}/NodeSeekUITests.xcresult
          retention-days: 7
      - name: Show CPU samples
        if: always()
        run: cat "$RUNNER_TEMP/cpu.log"

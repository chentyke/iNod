name: CI

on:
  pull_request:
  # PR checks exercise the trial merge. Run the workflow by hand to test a branch again.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  design-checks:
    name: Design checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip-swift: ${{ steps.scope.outputs.skip-swift }}
      skip-ui: ${{ steps.scope.outputs.skip-ui }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Choose checks for the changed files
        id: scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git diff --no-renames --name-only -z HEAD^1 HEAD | node scripts/ci-scope.mjs >> "$GITHUB_OUTPUT"
      - name: Check SwiftUI code against docs/DESIGN.md
        run: node scripts/check-design.mjs
      - name: Check hand-drawn symbol assets against their artwork
        run: pipx run scripts/icons/manage.py check

  swift-and-website:
    needs: design-checks
    if: ${{ !cancelled() && (needs.design-checks.result != 'success' || needs.design-checks.outputs.skip-swift != 'true') }}
    name: Swift and website checks
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Swift unit tests
        run: xcrun swift test
      - name: Check website scripts and WebKit parsing
        run: sh scripts/verify-website.sh

  iphone-ui-test-groups:
    needs: design-checks
    if: ${{ !cancelled() && (needs.design-checks.result != 'success' || needs.design-checks.outputs.skip-ui != 'true') }}
    name: iPhone UI tests (${{ matrix.group }}/2)
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: 1
            filter: only-testing
          - group: 2
            filter: skip-testing
    env:
      DEVICE: iPhone 17
      RESULTS: NodeSeekUITests-iPhone-${{ matrix.group }}
      TEST_FILTER: ${{ matrix.filter }}
      # Group 1 runs these classes. Group 2 runs the rest, including new test classes.
      TEST_CLASSES: >-
        CommunitySectionViewTests DesignChecklistTests AccountBalancesViewTests
        NodeImageLibraryViewTests ThreadImageGalleryTests StardustHistoryViewTests
        ThreadHistoryTests EditorImageNavigationTests RapidPostReturnTests InlineReplyTests
    steps: &simulator-test-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the ${{ env.DEVICE }} simulator
        id: simulator
        run: |
          simulator_id="$(xcrun simctl list devices available --json | node -e '
            const { devices } = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            const name = process.env.DEVICE;
            const simulator = devices["com.apple.CoreSimulator.SimRuntime.iOS-27-2"]?.find((device) => device.name === name);
            if (!simulator) throw new Error(`${name} with iOS 27.2 is unavailable`);
            console.log(simulator.udid);
          ')"
          xcrun simctl bootstatus "$simulator_id" -b
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"
      - name: Build and test on ${{ env.DEVICE }}
        shell: bash
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          read -ra args <<< "$TESTS $RETRIES"
          read -ra test_classes <<< "$TEST_CLASSES"
          for test_class in "${test_classes[@]}"; do
            args+=("-$TEST_FILTER:NodeSeekUITests/$test_class")
          done
          bash scripts/test-simulator.sh -project NodeSeek.xcodeproj -scheme NodeSeek \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO "${args[@]}" \
            CODE_SIGN_IDENTITY=-
      - name: Upload failed test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.RESULTS }}
          path: ${{ runner.temp }}/${{ env.RESULTS }}*.xcresult
          retention-days: 7

  ios-ui-tests:
    # Branch protection requires this check name.
    name: iOS UI tests
    needs: [design-checks, iphone-ui-test-groups]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check both iPhone test groups
        env:
          IPHONE_RESULT: ${{ needs.iphone-ui-test-groups.result }}
          SKIP_UI: ${{ needs.design-checks.result == 'success' && needs.design-checks.outputs.skip-ui == 'true' }}
        run: |
          if [[ "$IPHONE_RESULT" == skipped && "$SKIP_UI" == true ]]; then
            echo "Only documentation or Swift package tests changed."
          else
            echo "iPhone test groups: $IPHONE_RESULT"
            test "$IPHONE_RESULT" = success
          fi

  ipad-ui-tests:
    needs: design-checks
    if: ${{ !cancelled() && (needs.design-checks.result != 'success' || needs.design-checks.outputs.skip-ui != 'true') }}
    name: iPad UI tests
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVICE: iPad Pro 13-inch (M5)
      RESULTS: NodeSeekUITests-iPad
      TESTS: >-
        -only-testing:NodeSeekUITests/AdaptiveLayoutTests
        -only-testing:NodeSeekUITests/ThreadHistoryTests
        -only-testing:NodeSeekUITests/AttendanceViewTests/testUncheckedAttendanceShowsActionsAndKeepsReadableColumn
        -only-testing:NodeSeekUITests/ProgressViewTests/testUpgradingProgressShowsLevelQuotasAndKeepsReadableColumn
        -only-testing:NodeSeekUITests/StardustHistoryViewTests/testStardustHistoryDisplaysBalanceRecordsAndNavigates
      # The hosted iPad simulator is slow and now and then fails to stop the app between tests.
      # A test that fails both times still fails the check.
      RETRIES: -retry-tests-on-failure -test-iterations 2
    steps: *simulator-test-steps

  mac-ui-tests:
    needs: design-checks
    if: ${{ !cancelled() && (needs.design-checks.result != 'success' || needs.design-checks.outputs.skip-ui != 'true') }}
    name: Mac UI tests
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test the Mac Catalyst app
        # On the hosted Mac runner, clicks and key presses that UI tests send never reach the Catalyst app's
        # content, so the Mac runs only the checks that need no input. iPhone and iPad cover the rest.
        run: |
          xcodebuild -project NodeSeek.xcodeproj -scheme NodeSeek \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            -parallel-testing-enabled NO \
            -only-testing:NodeSeekUITests/AdaptiveLayoutTests/testAllTabsAreOnScreen \
            -only-testing:NodeSeekUITests/AdaptiveLayoutTests/testFeedKeepsAReadableCentredColumn \
            -only-testing:NodeSeekUITests/AdaptiveLayoutTests/testThreadCardsAndReplyBarShareOneColumn \
            -only-testing:NodeSeekUITests/AdaptiveLayoutTests/testConversationBubblesAndComposerShareOneColumn \
            -only-testing:NodeSeekUITests/AdaptiveLayoutTests/testMacNotificationsAndPrivateChatsHaveSeparatePages \
            -only-testing:NodeSeekUITests/AdaptiveLayoutTests/testSidebarSelectionIsReadableInDarkMode \
            -only-testing:NodeSeekUITests/AdaptiveLayoutTests/testSidebarTitlesAlignWithAnAccountAvatar \
            -only-testing:NodeSeekUITests/AdaptiveLayoutTests/testMenuBarIncludesManualRefreshCommand \
            -resultBundlePath "$RUNNER_TEMP/NodeSeekUITests-Mac.xcresult" \
            CODE_SIGN_IDENTITY=- test
      - name: Upload failed test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NodeSeekUITests-Mac
          path: ${{ runner.temp }}/NodeSeekUITests-Mac.xcresult
          retention-days: 7

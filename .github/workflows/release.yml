name: Package Release

on:
  workflow_dispatch:
    inputs:
      create_draft:
        description: Create a GitHub Release draft
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ios-release
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Archive for iPhone and iPad
        run: |
          xcodebuild -project NodeSeek.xcodeproj -scheme NodeSeek \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/iNod.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive
      - name: Archive for Mac
        # Apple silicon only launches signed code, so the Mac app gets an ad-hoc signature instead of none.
        run: |
          xcodebuild -project NodeSeek.xcodeproj -scheme NodeSeek \
            -configuration Release -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -archivePath "$RUNNER_TEMP/iNod-mac.xcarchive" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= archive
      - name: Package and verify unsigned IPA
        id: package
        run: |
          app="$RUNNER_TEMP/iNod.xcarchive/Products/Applications/NodeSeek.app"
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Info.plist")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a three-part App version, got: $version"
            exit 1
          fi
          if [[ -e "$app/embedded.mobileprovision" ]] || codesign -d "$app" 2>/dev/null; then
            echo "::error::Expected an unsigned App archive"
            exit 1
          fi
          tag="v$version"
          package="iNod-$tag-unsigned.ipa"
          mkdir -p "$RUNNER_TEMP/ipa/Payload" "$RUNNER_TEMP/release"
          ditto --noqtn --norsrc "$app" "$RUNNER_TEMP/ipa/Payload/NodeSeek.app"
          cd "$RUNNER_TEMP/release"
          ditto -c -k --norsrc --keepParent "$RUNNER_TEMP/ipa/Payload" "$package"
          unzip -tq "$package"
          shasum -a 256 "$package" > "$package.sha256"
          printf 'tag=%s\npackage=%s\n' "$tag" "$package" >> "$GITHUB_OUTPUT"
      - name: Package and verify Mac disk image
        id: mac
        env:
          TAG: ${{ steps.package.outputs.tag }}
        run: |
          app="$RUNNER_TEMP/iNod-mac.xcarchive/Products/Applications/NodeSeek.app"
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")
          if [[ "v$version" != "$TAG" ]]; then
            echo "::error::The Mac app is $version but the iOS app is ${TAG#v}"
            exit 1
          fi
          codesign --verify --strict "$app"
          for arch in arm64 x86_64; do
            if ! lipo "$app/Contents/MacOS/NodeSeek" -verify_arch "$arch"; then
              echo "::error::The Mac app is missing $arch"
              exit 1
            fi
          done
          package="iNod-$TAG-mac.dmg"
          mkdir -p "$RUNNER_TEMP/dmg"
          ditto --noqtn --norsrc "$app" "$RUNNER_TEMP/dmg/iNod.app"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          cd "$RUNNER_TEMP/release"
          hdiutil create -volname "iNod ${TAG#v}" -srcfolder "$RUNNER_TEMP/dmg" -fs HFS+ -format UDZO "$package"
          hdiutil verify "$package"
          shasum -a 256 "$package" > "$package.sha256"
          printf 'package=%s\n' "$package" >> "$GITHUB_OUTPUT"
      - name: Upload package to this run
        if: ${{ !inputs.create_draft }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iNod-${{ steps.package.outputs.tag }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7
      - name: Create GitHub Release draft
        if: inputs.create_draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          PACKAGE: ${{ steps.package.outputs.package }}
          MAC_PACKAGE: ${{ steps.mac.outputs.package }}
        run: |
          tag_ref=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" \
            --jq ".[] | select(.ref == \"refs/tags/$TAG\") | .ref")
          if [[ -n "$tag_ref" ]]; then
            echo "::error::Tag $TAG already exists. Bump the App version to create a new release."
            exit 1
          fi
          existing_release=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          if [[ -n "$existing_release" ]]; then
            echo "::error::A release or draft already exists for $TAG."
            exit 1
          fi
          gh release create "$TAG" "$PACKAGE" "$PACKAGE.sha256" "$MAC_PACKAGE" "$MAC_PACKAGE.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title "iNod $TAG" --generate-notes --notes-file - <<'NOTES'
          ## 安装

          - **iPhone 和 iPad**：下载 `.ipa`。它没有签名，安装前需要自行签名。
          - **Mac**（macOS 26 或更新）：打开 `.dmg`，把 iNod 拖进「应用程序」。它没有经过 Apple 公证，第一次打开时 macOS 会拦下，请在 **系统设置 → 隐私与安全性** 底部点 **仍要打开**。

          `.sha256` 文件用于校验下载是否完整。
          NOTES
        working-directory: ${{ runner.temp }}/release
